name: zerocks_customer
description: Zerocks - Secure Printing for Customers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  zerocks_common:
    path: ../zerocks_common
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  firebase_messaging: ^16.2.2
  google_maps_flutter: 2.12.0
  geolocator: ^14.0.2
  mobile_scanner: ^7.2.0
  file_picker: ^11.0.2
  permission_handler: ^12.0.1
  intl: ^0.20.2
  uuid: ^4.5.3
  pdfx: ^2.9.2
  image: ^4.8.0
  pdf: ^3.12.0
  razorpay_flutter: ^1.4.5
  cloud_functions: ^6.3.1
  cunning_document_scanner: ^1.4.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
dependency_overrides:
  google_maps_flutter_android: 2.12.0