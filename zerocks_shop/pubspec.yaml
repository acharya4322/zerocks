version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  zerocks_common:
    path: ../zerocks_common
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1
  syncfusion_flutter_pdfviewer: ^33.2.6
